<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#04050c">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <title>TabDeck</title>
  <link rel="stylesheet" href="/assets/pad.css">
  <link rel="stylesheet" href="/assets/pad-deco.css">
  <link rel="stylesheet" href="/assets/radio.css">
  <link rel="stylesheet" href="/assets/viz.css">
  <link rel="stylesheet" href="/assets/glow.css">
  <link rel="stylesheet" href="/assets/deco.css">
  <link rel="stylesheet" href="/assets/corners.css">
</head>
<body class="fx" oncontextmenu="return false">
  <div class="app">
    <main class="grid" id="grid"></main>
    <footer class="bar">
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <div class="chips" id="chips" hidden></div>
      <span class="dot" id="dot" title="Mac connection" data-i18n-title="pad.conn"></span>
      <button class="iconbtn" id="glow" type="button" hidden title="Ambient glow" aria-label="Ambient glow" data-i18n-title="pad.glow" data-i18n-aria="pad.glow">✦</button>
      <button class="iconbtn" id="mic" type="button" hidden title="Mic corners" aria-label="Mic corners" data-i18n-title="pad.mic" data-i18n-aria="pad.mic">◩</button>
      <button class="iconbtn" id="auto" type="button" hidden title="Follow the app in front on the Mac" aria-label="Follow the app in front on the Mac" data-i18n-title="pad.auto" data-i18n-aria="pad.auto">⇆</button>
      <button class="iconbtn" id="reload" type="button" title="Reload" aria-label="Reload" data-i18n-title="pad.reload" data-i18n-aria="pad.reload">↻</button>
      <button class="iconbtn" id="kiosk" type="button" title="Dashboard" aria-label="Dashboard" data-i18n-title="pad.kiosk" data-i18n-aria="pad.kiosk">▦</button>
      <button class="iconbtn" id="fs" type="button" aria-label="Fullscreen" data-i18n-aria="pad.fullscreen">⛶</button>
    </footer>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/assets/pad.js"></script>
  <script type="module" src="/assets/pad-deco.js"></script>
</body>
</html>
